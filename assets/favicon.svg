<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070b16"/>
  <circle cx="32" cy="32" r="28" fill="url(#nodeGlow)"/>
  
  <!-- Neural Network Synapses -->
  <path d="M18 46 L18 18 L32 38 L32 18" stroke="url(#cyanPurple)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M40 18 L46 18 M46 18 L46 42 A5 5 0 0 1 36 44" stroke="url(#cyanPurple)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  
  <!-- Synaptic Nodes -->
  <circle cx="18" cy="18" r="2.5" fill="#22d3ee"/>
  <circle cx="18" cy="46" r="2.5" fill="#8b5cf6"/>
  <circle cx="32" cy="18" r="2.5" fill="#22d3ee"/>
  <circle cx="32" cy="38" r="2.5" fill="#8b5cf6"/>
  <circle cx="46" cy="18" r="2.5" fill="#22d3ee"/>
  <circle cx="36" cy="44" r="2.5" fill="#8b5cf6"/>
</svg>
